name: Validate and deploy Gheralta East and African Shop website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f postal-codes.js
          test -f shop-config.js
          test -f payment-return.html
          test -f README.md
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check postcode data syntax
        run: node --check postal-codes.js
      - name: Check storefront configuration syntax
        run: node --check shop-config.js
      - name: Validate Gheralta shop catalogue
        run: |
          set -e

          # Validate the website title and motto
          grep -q "Gheralta East African Shop" index.html
          grep -qi "Changing the way" index.html

          # Validate all seven products
          grep -q 'name: "Ethiopian Coffee"' app.js
          grep -q 'name: "White Teff Flour"' app.js
          grep -q 'name: "Brown Teff Flour"' app.js
          grep -q 'name: "Berbere"' app.js
          grep -q 'name: "Shiro"' app.js
          grep -q 'name: "Habesha Beer"' app.js
          grep -q 'name: "Asmera Beer"' app.js

          # Validate product prices
          grep -Eq 'price:[[:space:]]*20\.00' app.js
          grep -Eq 'price:[[:space:]]*22\.00' app.js
          grep -Eq 'price:[[:space:]]*25\.00' app.js
          grep -Eq 'price:[[:space:]]*15\.00' app.js
          grep -Eq 'price:[[:space:]]*3\.00' app.js

          # Validate product quantities
          grep -q 'note: "1 kg bag"' app.js
          grep -q 'note: "5 kg bag"' app.js
          grep -q 'note: "Per bottle"' app.js

          # Validate contact information
          grep -q 'contact@gheralta-brussels.be' index.html
          grep -q 'Rue des Tanneurs 94' index.html
          grep -q '0471 34 83 73' index.html

          echo "Gheralta shop validation passed."

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            styles.css
            app.js
            postal-codes.js
            shop-config.js
            payment-return.html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
